server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-system
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:payment_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 3000ms

app:
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:86400}
  bank:
    mode: ${BANK_MODE:SUCCESS}
    timeout: ${BANK_TIMEOUT:5000}
  reconciliation:
    interval: ${RECONCILIATION_INTERVAL:30000}
