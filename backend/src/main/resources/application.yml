server:
  port: 8080

spring:
  application:
    name: payment-system
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:payment_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

app:
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:86400}
  bank:
    mode: ${BANK_MODE:SUCCESS}
    timeout: ${BANK_TIMEOUT:5000}
  reconciliation:
    interval: ${RECONCILIATION_INTERVAL:30000}
