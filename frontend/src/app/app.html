<div class="admin-shell">

  <!-- Mobile backdrop (tap to close sidebar) -->
  <div
    class="sidebar-backdrop"
    [class.visible]="sidebarOpen"
    (click)="closeSidebar()">
  </div>

  <!-- Sidebar -->
  <app-sidebar
    [class.open]="sidebarOpen"
    (tabChange)="onTabChange()">
  </app-sidebar>

  <!-- Main area -->
  <div class="main-area">

    <!-- Mobile topbar (hamburger + brand + current view) -->
    <div class="mobile-topbar">
      <button class="hamburger" [class.open]="sidebarOpen" (click)="toggleSidebar()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <span class="mobile-brand">Idempotency Lab</span>
      <span class="mobile-view-label">{{ pageCopy.badge }}</span>
    </div>

    <!-- Page banner (desktop / tablet) -->
    <header class="page-banner" #banner>
      <div class="banner-top">
        <div class="banner-copy">
          <p class="banner-eyebrow">Payments Control Room</p>
          <h1 class="banner-title">{{ pageCopy.title }}</h1>
          <p class="banner-sub">{{ pageCopy.subtitle }}</p>
        </div>

        <div class="banner-pills">
          <div class="banner-pill">
            <span class="pill-label">View</span>
            <span class="pill-value">{{ pageCopy.badge }}</span>
          </div>
          <div class="banner-pill">
            <span class="pill-label">Runtime</span>
            <span class="pill-value healthy">Healthy</span>
          </div>
          <div class="banner-pill">
            <span class="pill-label">Bank Mode</span>
            <span class="pill-value">{{ state.bankMode() | uppercase }}</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Scrollable content -->
    <div class="content-area" #contentArea>
      <app-overview       *ngIf="state.activeTab() === 'overview'"></app-overview>
      <app-lab            *ngIf="state.activeTab() === 'lab'"></app-lab>
      <app-bank-simulator *ngIf="state.activeTab() === 'bank'"></app-bank-simulator>
      <app-timeline       *ngIf="state.activeTab() === 'timeline'"></app-timeline>
    </div>

  </div>
</div>
