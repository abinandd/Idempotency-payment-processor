<div class="dashboard-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">Dashboard / <span class="text-white">{{ state.activeTab() | titlecase }}</span></div>
      <div class="topbar-actions">
        <div class="system-status"><span class="dot green"></span> ALL SYSTEMS OPERATIONAL</div>
      </div>
    </header>

    <div class="content-area">
      <app-overview *ngIf="state.activeTab() === 'overview'"></app-overview>
      <app-lab *ngIf="state.activeTab() === 'lab'"></app-lab>
      <app-bank-simulator *ngIf="state.activeTab() === 'bank'"></app-bank-simulator>
      <app-timeline *ngIf="state.activeTab() === 'timeline'"></app-timeline>
    </div>
  </main>
</div>
